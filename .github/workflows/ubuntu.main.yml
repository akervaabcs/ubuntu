name: RDP Linux

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Update system and install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies xrdp dbus-x11 \
            ufw curl

      - name: Create RDP User with Secure Password
        run: |
          # Generate a strong random password
          PASSWORD=$(tr -dc 'A-Za-z0-9!@#$%^&*()_+-=' < /dev/urandom | head -c 20)
          
          # Create user
          sudo useradd -m -s /bin/bash RDP
          echo "RDP:$PASSWORD" | sudo chpasswd
          
          # Add to necessary groups
          sudo usermod -aG sudo RDP
          sudo usermod -aG ssl-cert RDP
          
          # Save credentials
          echo "RDP_PASSWORD=$PASSWORD" >> $GITHUB_ENV
          echo "RDP_CREDS=User: RDP | Password: $PASSWORD" >> $GITHUB_ENV
          
          echo "Created user RDP with password: $PASSWORD"

      - name: Configure xrdp + XFCE properly
        run: |
          # 1. Create proper .xsession for the RDP user
          sudo -u RDP bash -c 'cat > ~/.xsession << EOF
          #!/bin/sh
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          export XDG_CONFIG_DIRS=/etc/xdg
          exec startxfce4
          EOF'
          sudo chmod +x /home/RDP/.xsession
          sudo chown RDP:RDP /home/RDP/.xsession

          # 2. Replace system startwm.sh (this is the most important fix)
          sudo tee /etc/xrdp/startwm.sh > /dev/null << 'EOF'
          #!/bin/sh
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG LANGUAGE
          fi

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          export XDG_CONFIG_DIRS=/etc/xdg

          # Force XFCE
          exec startxfce4
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh

          # 3. Make sure xrdp user can access certificates
          sudo adduser xrdp ssl-cert || true

          # 4. Optional but helpful: create empty config dirs
          sudo -u RDP mkdir -p /home/RDP/.config /home/RDP/.cache

      - name: Configure Firewall
        run: |
          sudo ufw --force reset
          sudo ufw default deny incoming
          sudo ufw default allow outgoing
          sudo ufw allow 22/tcp
          sudo ufw allow 3389/tcp
          sudo ufw --force enable

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-runner-$GITHUB_RUN_ID \
            --accept-routes
          
          # Wait for Tailscale IP
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            if [ -n "$TS_IP" ]; then
              echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
              echo "Got Tailscale IP: $TS_IP"
              break
            fi
            echo "Waiting for Tailscale IP... ($i)"
            sleep 3
          done
          
          if [ -z "$TS_IP" ]; then
            echo "Failed to get Tailscale IP"
            exit 1
          fi

      - name: Start xrdp services
        run: |
          # Kill any existing instances first
          sudo pkill -9 xrdp || true
          sudo pkill -9 xrdp-sesman || true
          sleep 1
          
          # Start cleanly
          sudo /usr/sbin/xrdp-sesman &
          sleep 2
          sudo /usr/sbin/xrdp &
          sleep 3
          
          echo "xrdp processes:"
          ps aux | grep -E 'xrdp|sesman' | grep -v grep || true
          ss -tlnp | grep 3389 || true

      - name: Maintain Connection
        run: |
          echo ""
          echo "=========================================="
          echo "=== RDP ACCESS (Linux + XFCE) ==="
          echo "Address:   $TAILSCALE_IP"
          echo "Username:  RDP"
          echo "Password:  $RDP_PASSWORD"
          echo "=========================================="
          echo ""
          echo "Connect now using any RDP client."
          echo ""
          
          while true; do
            echo "[$(date)] RDP Active - Cancel workflow to stop"
            sleep 300
          done
